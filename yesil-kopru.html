<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yeşil Köprü — Aracısız Tarım Pazaryeri</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f1e6;
    --bg-soft:#eee8d8;
    --card:#fffdf6;
    --ink:#26301f;
    --muted:#71805f;
    --green-900:#1d3524;
    --green-700:#2f6b3a;
    --green-600:#3a7d44;
    --green-100:#e3ecdb;
    --line:#e2dac4;
    --copper:#b0592b;
    --copper-dark:#8f451f;
    --copper-soft:#f3e2d3;
    --red:#a33a2a;
    --shadow:0 10px 30px rgba(38,48,31,.10);
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.55;
    min-height:100vh;
  }
  h1,h2,h3,.brand-name{font-family:'Fraunces',Georgia,serif;line-height:1.2}
  .mono{font-family:'Space Mono',ui-monospace,monospace}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
    border:none;border-radius:10px;padding:.62rem 1.15rem;
    font-weight:700;font-size:.92rem;transition:all .15s ease;
    text-decoration:none;white-space:nowrap;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:var(--green-700);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--green-900);transform:translateY(-1px)}
  .btn-copper{background:var(--copper);color:#fff}
  .btn-copper:hover:not(:disabled){background:var(--copper-dark);transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--green-900);border:1.5px solid var(--line)}
  .btn-ghost:hover:not(:disabled){border-color:var(--green-700);color:var(--green-700)}
  .btn-danger{background:transparent;color:var(--red);border:1.5px solid #e5c9c2}
  .btn-danger:hover:not(:disabled){background:var(--red);color:#fff;border-color:var(--red)}
  .btn-lg{padding:.85rem 1.6rem;font-size:1rem;border-radius:12px}
  .btn-sm{padding:.4rem .75rem;font-size:.82rem;border-radius:8px}
  .btn-block{width:100%}

  /* ---------- Nav ---------- */
  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(245,241,230,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:1120px;margin:0 auto;padding:.7rem 1.25rem;
    display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:.6rem;background:none;border:none;padding:0}
  .brand svg{display:block}
  .brand-name{font-size:1.3rem;font-weight:700;color:var(--green-900)}
  .brand-sub{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:'Space Mono',monospace;display:block;margin-top:-2px}
  .nav-links{display:flex;align-items:center;gap:.25rem;margin-left:.5rem}
  .nav-link{
    background:none;border:none;padding:.45rem .7rem;border-radius:8px;
    font-size:.9rem;font-weight:600;color:var(--ink);text-decoration:none;
  }
  .nav-link:hover{background:var(--green-100);color:var(--green-900)}
  .nav-link.active{background:var(--green-700);color:#fff}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
  .user-chip{
    display:flex;align-items:center;gap:.55rem;
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:.3rem .55rem .3rem .4rem;
  }
  .avatar{
    width:30px;height:30px;border-radius:50%;background:var(--green-700);color:#fff;
    display:grid;place-items:center;font-size:.72rem;font-weight:800;letter-spacing:.02em;
  }
  .user-chip .who{line-height:1.15}
  .user-chip .who b{font-size:.84rem;display:block}
  .role-badge{
    font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    font-family:'Space Mono',monospace;
  }
  .role-badge.producer{color:var(--green-700)}
  .role-badge.buyer{color:var(--copper)}

  /* ---------- Layout ---------- */
  .container{max-width:1120px;margin:0 auto;padding:2rem 1.25rem 4rem}
  .page-head{margin-bottom:1.5rem}
  .page-head h1{font-size:1.9rem;color:var(--green-900)}
  .page-head p{color:var(--muted);margin-top:.35rem;max-width:60ch}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .grid{display:grid;gap:1rem}

  /* ---------- Landing ---------- */
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:2.5rem;align-items:center;padding-top:1.5rem}
  .kicker{
    display:inline-flex;align-items:center;gap:.45rem;
    font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--copper-dark);background:var(--copper-soft);
    border:1px solid #e4c9b2;border-radius:999px;padding:.35rem .8rem;margin-bottom:1.1rem;
  }
  .hero h1{font-size:clamp(2rem,4.4vw,3.1rem);color:var(--green-900);font-weight:700}
  .hero h1 em{font-style:normal;color:var(--copper)}
  .hero .lede{margin-top:1.1rem;font-size:1.03rem;color:#4a5640;max-width:58ch}
  .hero .lede strong{color:var(--copper-dark)}
  .hero-ctas{display:flex;gap:.75rem;margin-top:1.5rem;flex-wrap:wrap}
  .hero-note{margin-top:.8rem;font-size:.8rem;color:var(--muted)}
  .stat-pills{display:flex;gap:.7rem;margin-top:1.6rem;flex-wrap:wrap}
  .stat-pill{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:.6rem .95rem;box-shadow:var(--shadow);
  }
  .stat-pill .num{font-family:'Space Mono',monospace;font-weight:700;font-size:1.15rem;color:var(--copper)}
  .stat-pill .lbl{font-size:.72rem;color:var(--muted)}

  .illus-wrap{position:relative}
  .illus{width:100%;height:auto;display:block}
  .illus .truck{animation:drive 7s linear infinite}
  @keyframes drive{
    0%{transform:translateX(158px);opacity:1}
    52%{transform:translateX(505px);opacity:1}
    53%{opacity:0}
    60%{transform:translateX(158px);opacity:0}
    66%{opacity:1}
    100%{transform:translateX(158px);opacity:1}
  }
  .illus-caption{
    text-align:center;font-size:.78rem;color:var(--muted);margin-top:.4rem;
    font-family:'Space Mono',monospace;letter-spacing:.06em;
  }

  .how{margin-top:3.5rem}
  .how h2{font-size:1.45rem;color:var(--green-900);margin-bottom:1.1rem}
  .how-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
  .how-step{padding:1.1rem 1.15rem}
  .how-step .n{
    font-family:'Space Mono',monospace;font-weight:700;color:#fff;background:var(--green-700);
    width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.8rem;margin-bottom:.6rem;
  }
  .how-step h3{font-size:1rem;margin-bottom:.25rem}
  .how-step p{font-size:.83rem;color:var(--muted)}
  .cta-band{
    margin-top:3rem;border-radius:var(--radius);
    background:linear-gradient(120deg,var(--green-900),var(--green-700));
    color:#fff;padding:2.2rem 2rem;display:flex;align-items:center;justify-content:space-between;
    gap:1.5rem;flex-wrap:wrap;box-shadow:var(--shadow);
  }
  .cta-band h2{font-size:1.5rem}
  .cta-band p{opacity:.85;font-size:.92rem;margin-top:.3rem;max-width:52ch}
  .cta-band .btn-copper{box-shadow:0 6px 18px rgba(0,0,0,.25)}

  /* ---------- Auth ---------- */
  .auth-wrap{max-width:920px;margin:1.5rem auto 0;display:grid;grid-template-columns:.9fr 1.1fr;gap:1.5rem;align-items:stretch}
  .auth-side{
    background:linear-gradient(160deg,var(--green-900),var(--green-700));color:#fff;
    border-radius:var(--radius);padding:2rem 1.7rem;display:flex;flex-direction:column;justify-content:space-between;gap:1.5rem;
  }
  .auth-side h2{font-size:1.5rem}
  .auth-side p{opacity:.85;font-size:.9rem}
  .auth-side .mini-stats{display:grid;gap:.7rem}
  .mini-stat{display:flex;align-items:baseline;gap:.6rem;background:rgba(255,255,255,.08);border-radius:10px;padding:.6rem .8rem}
  .mini-stat .v{font-family:'Space Mono',monospace;font-weight:700;font-size:1.1rem;color:#f4cfae}
  .mini-stat .k{font-size:.78rem;opacity:.85}
  .auth-card{padding:1.7rem}
  .auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg-soft);border-radius:10px;padding:4px;margin-bottom:1.3rem}
  .auth-tab{
    border:none;background:transparent;border-radius:8px;padding:.55rem;
    font-weight:700;font-size:.92rem;color:var(--muted);
  }
  .auth-tab.active{background:var(--card);color:var(--green-900);box-shadow:0 2px 8px rgba(38,48,31,.12)}
  .auth-notice{
    background:var(--copper-soft);border:1px solid #e4c9b2;color:var(--copper-dark);
    border-radius:10px;padding:.6rem .85rem;font-size:.82rem;margin-bottom:1rem;
  }
  .field{margin-bottom:.85rem}
  .field label{display:block;font-size:.8rem;font-weight:700;margin-bottom:.3rem;color:var(--green-900)}
  .field input,.field select{
    width:100%;padding:.6rem .75rem;border:1.5px solid var(--line);border-radius:10px;
    background:#fff;font-size:.92rem;color:var(--ink);transition:border-color .15s;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--green-600)}
  .field .hint{font-size:.72rem;color:var(--muted);margin-top:.25rem}
  .field .err{font-size:.76rem;color:var(--red);margin-top:.25rem;font-weight:600}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
  .role-opts{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .role-opt{
    border:1.5px solid var(--line);border-radius:12px;padding:.7rem .8rem;display:flex;gap:.6rem;align-items:center;
    cursor:pointer;background:#fff;transition:all .15s;font-size:.86rem;
  }
  .role-opt:has(input:checked){border-color:var(--green-700);background:var(--green-100)}
  .role-opt input{accent-color:var(--green-700)}
  .role-opt b{display:block;font-size:.88rem}
  .role-opt small{color:var(--muted);font-size:.72rem}
  .role-opt .ico{font-size:1.4rem}
  .demo-box{
    margin-top:1.1rem;border:1.5px dashed #cdbf9d;border-radius:12px;padding:.85rem 1rem;background:#fbf7ec;
  }
  .demo-box h4{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;font-family:'Space Mono',monospace}
  .demo-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;font-size:.8rem;padding:.3rem 0;flex-wrap:wrap}
  .demo-row .creds{font-family:'Space Mono',monospace;font-size:.74rem}
  .demo-row .creds b{color:var(--copper-dark)}

  /* ---------- Panels ---------- */
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
  .stat-card{padding:1rem 1.2rem}
  .stat-card .v{font-family:'Space Mono',monospace;font-weight:700;font-size:1.45rem;color:var(--green-900)}
  .stat-card .v.copper{color:var(--copper)}
  .stat-card .k{font-size:.76rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
  .panel-grid{display:grid;grid-template-columns:340px 1fr;gap:1.5rem;align-items:start}
  .form-card{padding:1.3rem;position:sticky;top:80px}
  .form-card h3{font-size:1.15rem;color:var(--green-900);margin-bottom:1rem}
  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1rem}
  .section-title h2{font-size:1.3rem;color:var(--green-900)}
  .section-title .count{font-family:'Space Mono',monospace;font-size:.8rem;color:var(--muted)}
  .listings{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
  .listing-card{padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.55rem;position:relative}
  .listing-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem}
  .listing-name{font-weight:800;font-size:1.02rem;display:flex;align-items:center;gap:.45rem}
  .listing-name .em{font-size:1.25rem}
  .price{font-family:'Space Mono',monospace;font-weight:700;color:var(--copper);font-size:1.05rem;text-align:right;line-height:1.1}
  .price small{display:block;font-weight:400;color:var(--muted);font-size:.66rem}
  .listing-meta{font-size:.8rem;color:var(--muted);display:grid;gap:.2rem}
  .listing-meta .mono{color:var(--ink)}
  .chips{display:flex;gap:.4rem;flex-wrap:wrap}
  .chip{
    font-size:.68rem;font-family:'Space Mono',monospace;font-weight:700;
    background:var(--green-100);color:var(--green-900);border-radius:999px;padding:.2rem .6rem;
  }
  .chip.copper{background:var(--copper-soft);color:var(--copper-dark)}
  .chip.plain{background:var(--bg-soft);color:var(--muted)}
  .card-foot{margin-top:auto;padding-top:.5rem;display:flex;gap:.5rem;align-items:center;justify-content:space-between}
  .producer-by{font-size:.74rem;color:var(--muted)}
  .producer-by b{color:var(--green-900)}
  .empty{
    grid-column:1/-1;text-align:center;padding:2.5rem 1rem;color:var(--muted);
    border:1.5px dashed var(--line);border-radius:var(--radius);background:#fbf8ef;
  }
  .empty .big{font-size:2rem;margin-bottom:.4rem}

  /* ---------- Search ---------- */
  .search-card{padding:1.1rem 1.2rem;margin-bottom:1.4rem}
  .search-grid{display:grid;grid-template-columns:1.4fr 1fr auto;gap:.8rem;align-items:end}
  .search-grid .field{margin-bottom:0}

  /* ---------- Orders ---------- */
  .orders{margin-top:2rem}
  .order-row{
    display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;
    padding:.75rem 1rem;border-bottom:1px solid var(--line);font-size:.86rem;
  }
  .order-row:last-child{border-bottom:none}
  .order-row .no{font-family:'Space Mono',monospace;font-weight:700;color:var(--green-700)}
  .order-row .sum{font-family:'Space Mono',monospace;color:var(--copper);font-weight:700}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(29,53,36,.55);backdrop-filter:blur(3px);
    z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;
  }
  .modal{
    background:var(--card);border-radius:18px;max-width:880px;width:100%;max-height:92vh;overflow:auto;
    box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{
    padding:1.2rem 1.5rem;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:1rem;position:sticky;top:0;background:var(--card);z-index:2;
  }
  .modal-head h3{font-size:1.25rem;color:var(--green-900)}
  .modal-head .sub{font-size:.8rem;color:var(--muted)}
  .x-btn{background:none;border:none;font-size:1.4rem;color:var(--muted);line-height:1;padding:.2rem .5rem;border-radius:8px}
  .x-btn:hover{background:var(--bg-soft)}
  .modal-body{padding:1.4rem 1.5rem}
  .parties{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.9rem}
  .party{border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;background:#fbf8ef}
  .party.hero-party{border-color:var(--green-700);background:var(--green-100)}
  .party .tag{
    font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);
    margin-bottom:.5rem;font-family:'Space Mono',monospace;
  }
  .party .pname{font-weight:800;display:flex;align-items:center;gap:.45rem}
  .party .pdet{font-size:.78rem;color:var(--muted);margin-top:.35rem;display:grid;gap:.15rem}
  .party .pdet .mono{color:var(--ink)}
  .badge-rec{
    display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.06em;
    background:var(--copper);color:#fff;border-radius:6px;padding:.15rem .45rem;margin-left:.3rem;
    text-transform:uppercase;font-family:'Space Mono',monospace;
  }
  .cost-card{margin-top:1.2rem;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .cost-title{padding:.7rem 1rem;background:var(--bg-soft);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);font-family:'Space Mono',monospace}
  .cost-rows{padding:.6rem 1rem .8rem}
  .cost-row{display:flex;justify-content:space-between;align-items:baseline;padding:.4rem 0;font-size:.9rem}
  .cost-row .v{font-family:'Space Mono',monospace;font-weight:700}
  .cost-row.total{border-top:1.5px dashed var(--line);margin-top:.3rem;padding-top:.7rem;font-size:1rem}
  .cost-row.total .v{font-size:1.35rem;color:var(--copper)}
  .savings{
    margin-top:1rem;border-radius:12px;padding:1rem 1.2rem;
    background:linear-gradient(120deg,var(--green-100),#f0ead6);border:1.5px solid #cfe0c4;
    display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  }
  .savings .lbl{font-size:.82rem;color:var(--green-900);font-weight:700}
  .savings .lbl small{display:block;color:var(--muted);font-weight:500;font-size:.72rem;margin-top:.15rem}
  .savings .val{font-family:'Space Mono',monospace;font-weight:700;font-size:1.5rem;color:var(--green-700)}
  .savings .val small{font-size:.85rem;color:var(--copper-dark)}
  .warn-box{
    margin-top:1rem;background:#fdf1e2;border:1.5px solid #eccfa8;color:#8a5a17;
    border-radius:10px;padding:.7rem 1rem;font-size:.85rem;
  }
  .modal-foot{padding:1.1rem 1.5rem 1.4rem;display:flex;gap:.8rem;justify-content:flex-end;flex-wrap:wrap}

  /* ---------- Success ---------- */
  .success-card{
    max-width:480px;width:100%;background:var(--card);border-radius:18px;text-align:center;
    padding:2.4rem 2rem;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .25s ease;
  }
  .check-wrap{width:92px;height:92px;margin:0 auto 1.1rem}
  .check-circle{stroke:var(--green-600);stroke-width:4;fill:none;stroke-dasharray:290;stroke-dashoffset:290;animation:draw .7s ease forwards}
  .check-mark{stroke:var(--green-600);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .45s ease .55s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .success-card h2{font-size:1.7rem;color:var(--green-900)}
  .success-card .sub{color:var(--muted);font-size:.9rem;margin-top:.3rem}
  .success-order{
    font-family:'Space Mono',monospace;font-weight:700;font-size:1.15rem;color:var(--copper);
    background:var(--copper-soft);border-radius:10px;display:inline-block;padding:.45rem 1rem;margin:1rem 0 1.3rem;
  }
  .success-summary{text-align:left;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:1.4rem}
  .s-row{display:flex;justify-content:space-between;gap:1rem;padding:.55rem .95rem;font-size:.85rem;border-bottom:1px solid var(--line)}
  .s-row:last-child{border-bottom:none}
  .s-row .k{color:var(--muted)}
  .s-row .v{font-family:'Space Mono',monospace;font-weight:700;text-align:right}
  .s-row .v.green{color:var(--green-700)}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--green-900);color:#fff;padding:.7rem 1.3rem;border-radius:999px;
    font-size:.88rem;font-weight:600;opacity:0;pointer-events:none;transition:all .25s ease;z-index:200;
    box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer{border-top:1px solid var(--line);margin-top:2rem}
  .footer-inner{
    max-width:1120px;margin:0 auto;padding:1.3rem 1.25rem;display:flex;justify-content:space-between;gap:1rem;
    font-size:.78rem;color:var(--muted);flex-wrap:wrap;align-items:center;
  }
  .footer-inner button{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.78rem}
  .footer-inner button:hover{color:var(--copper)}

function haversineKm(a, b){
  const R=6371, rad=d=>d*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h)));
}
const provinceCoord = name => PROVINCES.find(p=>p.name===name);
function distanceBetween(p1, p2){
  if(!p1 || !p2) return null;
  if(p1===p2) return 0;
  return haversineKm(provinceCoord(p1), provinceCoord(p2));
}

/* En uygun taşıyıcı: önce birebir güzergâh + yeterli kapasite, yoksa en yakın güzergâh */
function recommendCarrier(fromProvince, toProvince, qtyKg){
  const qtyTon = qtyKg/1000;
  const fits = c => c.capacityTon >= qtyTon;
  const exact = state.carriers.filter(c=>fits(c) && c.from===fromProvince && c.to===toProvince);
  if(exact.length){
    exact.sort((a,b)=> a.rateTon-b.rateTon || Math.abs(a.capacityTon-qtyTon)-Math.abs(b.capacityTon-qtyTon));
    return { carrier:exact[0], exactRoute:true };
  }
  const any = state.carriers.filter(fits);
  if(any.length){
    any.sort((a,b)=>{
      const da = distanceBetween(a.from,fromProvince)+distanceBetween(toProvince,a.to);
      const db = distanceBetween(b.from,fromProvince)+distanceBetween(toProvince,b.to);
      return (da-db) || a.rateTon-b.rateTon;
    });
    return { carrier:any[0], exactRoute:false };
  }
  return null;
}

function searchArzlar(){
  const u = state.user;
  const q = trLower(state.filter.q.trim());
  const prov = state.filter.province;
  let list = state.arzlar.filter(a=>{
    const okQ = !q || trLower(a.productName).includes(q);
    const okP = prov==='Tümü' || a.province===prov;
    return okQ && okP;
  });
  list = list.map(a=>({ a, d: distanceBetween(u.province, a.province) ?? 99999 }))
             .sort((x,y)=> x.d-y.d || x.a.priceKg-y.a.priceKg)
             .map(x=>x.a);
  return list;
}

/* ------------------------------- Render ------------------------------- */
function render(){
  renderNav();
  renderFooter();

  const v = state.view;
  const u = state.user;
  const GUARDED = { producer:'Üretici Paneli', buyer:'Alıcı Paneli', logistics:'Lojistik Ağı' };

  if(v==='auth'){ $('#app').innerHTML = renderAuth(); return; }

  if(GUARDED[v]){
    const roleOk =
      (v==='producer' && u && u.role==='producer') ||
      (v==='buyer'    && u && u.role==='buyer')    ||
      (v==='logistics'&& u);
    if(!roleOk){
      $('#app').innerHTML = renderGate(GUARDED[v], u ? 'role' : 'guest');
      return;
    }
    $('#app').innerHTML = v==='producer' ? renderProducer() : v==='buyer' ? renderBuyer() : renderLogistics();
    return;
  }

  $('#app').innerHTML = renderLanding();
}

/* --------------------------- Modal ekranları -------------------------- */
function openMatch(arzId){
  state.matchingArzId = arzId;
  state.confirmDeleteId = null;
  render();
  renderMatchModal();
}

function closeMatch(){
  state.matchingArzId = null;
  $('#modal-root').innerHTML = '';
  render();
}

function renderMatchModal(){
  const a = state.arzlar.find(x=>x.id===state.matchingArzId);
  if(!a){ closeMatch(); return; }
  const u = state.user;
  const producer = state.users.find(x=>x.id===a.ownerId);
  const rec = recommendCarrier(a.province, u.province, a.qtyKg);
  const qtyTon = a.qtyKg/1000;

  let costRows='', savings='', warn='', confirmDisabled=false;
  if(rec){
    const shipping = rec.carrier.rateTon * Math.max(1, Math.ceil(qtyTon));
    const productCost = a.qtyKg * a.priceKg;
    const total = productCost + shipping;
    const traditional = productCost * TRADITIONAL_MARKUP;
    const save = traditional - total;
    const savePct = Math.round((1 - total/traditional)*100);

    costRows = `
      <div class="cost-row"><span>Ürün bedeli <span class="mono" style="color:var(--muted)">(${fmtKg(a.qtyKg)} × ${fmtTL2(a.priceKg)}/kg)</span></span><span class="v">${fmtTL(productCost)}</span></div>
      <div class="cost-row"><span>Nakliye <span class="mono" style="color:var(--muted)">(${fmtNum(Math.max(1,Math.ceil(qtyTon)))} ton × ${fmtTL(rec.carrier.rateTon)})</span></span><span class="v">${fmtTL(shipping)}</span></div>
      <div class="cost-row total"><span><b>Toplam</b></span><span class="v">${fmtTL(total)}</span></div>`;

    savings = `
      <div class="savings">
        <div class="lbl">Geleneksel (aracılı) zincire göre tahmini tasarruf
          <small>Aracı katkısı +%350 esas alınarak hesaplandı (rapor: %300–600 bandının orta değeri) · Geleneksel maliyet: ${fmtTL(traditional)}</small>
        </div>
        <div class="val">${fmtTL(save)} <small>≈ %${savePct} daha az</small></div>
      </div>`;
  } else {
    confirmDisabled = true;
    warn = `<div class="warn-box">⚠ Bu miktar için yeterli kapasitede taşıyıcı bulunamadı. Lojistik Ağı sayfasından kapasite ekleyebilir veya daha küçük miktarla deneyebilirsiniz.</div>`;
  }

  $('#modal-root').innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeMatch()">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Eşleştirme özeti">
      <div class="modal-head">
        <div>
          <h3>Eşleştirme Özeti</h3>
          <div class="sub">${emoji(a.productName)} ${esc(a.productName)} · ${fmtKg(a.qtyKg)} · ${esc(a.province)} → ${esc(u.province)}</div>
        </div>
        <button class="x-btn" onclick="closeMatch()" aria-label="Kapat">✕</button>
      </div>
      <div class="modal-body">
        <div class="parties">
          <div class="party">
            <div class="tag">🚜 Üretici</div>
            <div class="pname">${esc(a.ownerName)}</div>
            <div class="pdet">
              <span>📍 ${esc(a.province)}</span>
              <span class="mono">☎ ${esc(producer?producer.phone:'—')}</span>
              <span>Hasat: <span class="mono">${fmtDate(a.harvestDate)}</span></span>
            </div>
          </div>
          <div class="party ${rec?'hero-party':''}">
            <div class="tag">🚛 Taşıyıcı</div>
            ${rec ? `
            <div class="pname">${esc(rec.carrier.name)}${rec.exactRoute?'<span class="badge-rec">birebir güzergâh</span>':'<span class="badge-rec" style="background:#8a6b45">en yakın güzergâh</span>'}</div>
            <div class="pdet">
              <span>📍 ${esc(rec.carrier.from)} → ${esc(rec.carrier.to)}</span>
              <span>Kapasite: <span class="mono">${fmtNum(rec.carrier.capacityTon)} ton</span> · Ücret: <span class="mono">${fmtTL(rec.carrier.rateTon)}/ton</span></span>
              <span class="mono">☎ ${esc(rec.carrier.contact)}</span>
            </div>` : `<div class="pdet"><span>Uygun taşıyıcı yok</span></div>`}
          </div>
          <div class="party">
            <div class="tag">🏪 Alıcı</div>
            <div class="pname">${esc(u.name)}</div>
            <div class="pdet">
              <span>📍 ${esc(u.province)}</span>
              <span class="mono">☎ ${esc(u.phone)}</span>
            </div>
          </div>
        </div>

        ${rec ? `
        <div class="cost-card">
          <div class="cost-title">Maliyet Dökümü — Ürün Bedeli + Nakliye = Toplam</div>
          <div class="cost-rows">${costRows}</div>
        </div>
        ${savings}` : warn}
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeMatch()">Vazgeç</button>
        <button class="btn btn-primary btn-lg" ${confirmDisabled?'disabled':''} onclick="confirmDeal()">Alım-Satımı Onayla</button>
      </div>
    </div>
  </div>`;
}

function confirmDeal(){
  const a = state.arzlar.find(x=>x.id===state.matchingArzId);
  if(!a) return;
  const u = state.user;
  const rec = recommendCarrier(a.province, u.province, a.qtyKg);
  if(!rec){ showToast('Uygun taşıyıcı bulunamadı.'); return; }

  const shipping = rec.carrier.rateTon * Math.max(1, Math.ceil(a.qtyKg/1000));
  const productCost = a.qtyKg * a.priceKg;
  const total = productCost + shipping;
  const traditional = productCost * TRADITIONAL_MARKUP;
  const save = traditional - total;

  const order = {
    no: `YK-${new Date().getFullYear()}-${String(state.orders.length+1).padStart(4,'0')}`,
    productName:a.productName, qtyKg:a.qtyKg, priceKg:a.priceKg,
    producerId:a.ownerId, producerName:a.ownerName, producerProvince:a.province,
    buyerId:u.id, buyerName:u.name, buyerProvince:u.province,
    carrierName:rec.carrier.name, route:`${rec.carrier.from} → ${rec.carrier.to}`,
    productCost, shippingCost:shipping, total, savings:save,
    date:new Date().toISOString().slice(0,10),
  };
  state.orders.push(order);
  state.arzlar = state.arzlar.filter(x=>x.id!==a.id);   // arz satıldı → listeden kalktı
  state.matchingArzId = null;
  $('#modal-root').innerHTML = '';
  showSuccess(order);
}

function showSuccess(order){
  render();
  $('#modal-root').innerHTML = `
  <div class="overlay">
    <div class="success-card" role="dialog" aria-modal="true" aria-label="İşlem başarılı">
      <div class="check-wrap">
        <svg viewBox="0 0 100 100" width="92" height="92">
          <circle class="check-circle" cx="50" cy="50" r="45"/>
          <path class="check-mark" d="M30 52 L45 66 L72 36"/>
        </svg>
      </div>
      <h2>İşlem Başarılı!</h2>
      <p class="sub">Alım-satım onaylandı, arz aktif listeden kaldırıldı ve taşıyıcıya bilgi verildi.</p>
      <div class="success-order">${esc(order.no)}</div>
      <div class="success-summary">
        <div class="s-row"><span class="k">Ürün</span><span class="v">${emoji(order.productName)} ${esc(order.productName)} · ${fmtKg(order.qtyKg)}</span></div>
        <div class="s-row"><span class="k">Üretici → Alıcı</span><span class="v">${esc(order.producerName)} → ${esc(order.buyerName)}</span></div>
        <div class="s-row"><span class="k">Taşıyıcı</span><span class="v">${esc(order.carrierName)} (${esc(order.route)})</span></div>
        <div class="s-row"><span class="k">Ürün bedeli + Nakliye</span><span class="v">${fmtTL(order.productCost)} + ${fmtTL(order.shippingCost)}</span></div>
        <div class="s-row"><span class="k">Ödenen Toplam</span><span class="v">${fmtTL(order.total)}</span></div>
        <div class="s-row"><span class="k">Tahmini Tasarruf</span><span class="v green">${fmtTL(order.savings)}</span></div>
      </div>
      <button class="btn btn-primary btn-lg btn-block" onclick="closeSuccess()">Kapat</button>
    </div>
  </div>`;
}

function closeSuccess(){
  state.successOrder = null;
  $('#modal-root').innerHTML = '';
  render();
}

/* ------------------------------ Aksiyonlar ---------------------------- */
function setView(v){
  const GUARDED = { producer:true, buyer:true, logistics:true };
  if(GUARDED[v] && !state.user){
    state.view='auth'; state.authTab='login';
    state.authNotice = 'Bu sayfa yalnızca giriş yapmış kullanıcılara açıktır. Devam etmek için oturum açın.';
    render(); window.scrollTo(0,0); return;
  }
  state.view=v; state.confirmDeleteId=null;
  render(); window.scrollTo(0,0);
}
function openAuth(tab){
  state.view='auth'; state.authTab=tab;
  render(); window.scrollTo(0,0);
}
function setAuthTab(tab){ state.authTab=tab; state.authNotice=''; render(); }

function fillLogin(email){
  $('#li-email').value = email;
  $('#li-pass').value = '123456';
}

function handleLogin(e){
  e.preventDefault();
  const email = $('#li-email').value.trim().toLowerCase();
  const pass = $('#li-pass').value;
  if(!email || !pass){ showToast('Lütfen e-posta ve şifrenizi girin.'); return false; }
  const u = state.users.find(x=>x.email.toLowerCase()===email && x.password===pass);
  if(!u){ showToast('E-posta veya şifre hatalı. Demo hesapları deneyebilirsiniz.'); return false; }
  loginAs(u);
  return false;
}

function handleRegister(e){
  e.preventDefault();
  const name = $('#rg-name').value.trim();
  const phone = $('#rg-phone').value.trim();
  const province = $('#rg-province').value;
  const email = $('#rg-email').value.trim().toLowerCase();
  const pass = $('#rg-pass').value;
  const role = document.querySelector('input[name="rg-role"]:checked').value;

  if(name.length<3){ showToast('Lütfen adınızı ve soyadınızı girin.'); return false; }
  if(!/^[\d\s()+-]{7,}$/.test(phone)){ showToast('Geçerli bir telefon numarası girin.'); return false; }
  if(!/^\S+@\S+\.\S+$/.test(email)){ showToast('Geçerli bir e-posta adresi girin.'); return false; }
  if(pass.length<6){ showToast('Şifre en az 6 karakter olmalıdır.'); return false; }
  if(state.users.some(x=>x.email.toLowerCase()===email)){
    showToast('Bu e-posta zaten kayıtlı. Giriş yapmayı deneyin.'); return false;
  }
  const u = { id:'u'+(state.users.length+1)+'_'+Date.now().toString(36), name, phone, province, email, password:pass, role };
  state.users.push(u);
  loginAs(u, true);
  return false;
}

function loginAs(u, isNew=false){
  state.user = u;
  state.view = u.role==='producer' ? 'producer' : 'buyer';
  state.authNotice=''; state.filter={ q:'', province:'Tümü' };
  render(); window.scrollTo(0,0);
  showToast(isNew ? `Hoş geldin ${u.name}! Hesabın oluşturuldu.` : `Tekrar hoş geldin, ${u.name}.`);
}

function quickLogin(){
  const u = state.users.find(x=>x.email==='zeynep@greenbridge.tr');
  if(u) loginAs(u);
}

function logout(){
  state.user=null; state.view='landing';
  state.matchingArzId=null; state.confirmDeleteId=null;
  $('#modal-root').innerHTML='';
  render(); window.scrollTo(0,0);
  showToast('Çıkış yapıldı. Görüşmek üzere!');
}

/* Üretici: arz ekle */
function handleAddArz(e){
  e.preventDefault();
  const u = state.user;
  const productName = $('#arz-product').value;
  const qtyKg = parseFloat($('#arz-qty').value);
  const priceKg = parseFloat($('#arz-price').value);
  const province = $('#arz-province').value || u.province;
  const harvestDate = $('#arz-date').value;
  const errBox = $('#arz-error');

  const fail = msg => { errBox.innerHTML = `<div class="field err">${esc(msg)}</div>`; return false; };
  if(!qtyKg || qtyKg<=0) return fail('Lütfen geçerli bir miktar girin (kg).');
  if(!priceKg || priceKg<=0) return fail('Lütfen geçerli bir fiyat girin (TL/kg).');
  if(!harvestDate) return fail('Lütfen hasat tarihini seçin.');

  state.arzlar.push({
    id:'a'+Date.now().toString(36), productName, qtyKg, priceKg,
    province, harvestDate, ownerId:u.id, ownerName:u.name,
  });
  render();
  showToast(`"${productName}" arzı yayınlandı.`);
  return false;
}

/* Üretici: arz sil (iki adımlı onay) */
function askDeleteArz(id){ state.confirmDeleteId=id; render(); }
function cancelDeleteArz(){ state.confirmDeleteId=null; render(); }
function confirmDeleteArz(id){
  const a = state.arzlar.find(x=>x.id===id);
  state.arzlar = state.arzlar.filter(x=>x.id!==id);
  state.confirmDeleteId=null;
  render();
  showToast(a ? `"${a.productName}" arzı silindi.` : 'Arz silindi.');
}

/* Alıcı: arama */
function handleSearch(e){
  e.preventDefault();
  state.filter = { q:$('#sr-q').value, province:$('#sr-province').value };
  render();
  return false;
}

/* Lojistik: taşıyıcı ekle */
function handleAddCarrier(e){
  e.preventDefault();
  const name = $('#c-name').value.trim();
  const from = $('#c-from').value;
  const to = $('#c-to').value;
  const capacityTon = parseFloat($('#c-cap').value);
  const rateTon = parseFloat($('#c-rate').value);
  const errBox = $('#carrier-error');
  const fail = msg => { errBox.innerHTML = `<div class="field err">${esc(msg)}</div>`; return false; };

  if(name.length<3) return fail('Lütfen firma adını girin.');
  if(from===to) return fail('Kalkış ve varış ili aynı olamaz.');
  if(!capacityTon || capacityTon<=0) return fail('Lütfen geçerli bir kapasite girin (ton).');
  if(!rateTon || rateTon<=0) return fail('Lütfen geçerli bir birim ücret girin (TL/ton).');

  state.carriers.push({
    id:'c'+Date.now().toString(36), name, from, to, capacityTon, rateTon,
    contact: state.user ? state.user.phone : '—',
  });
  render();
  showToast(`"${name}" lojistik ağına kaydedildi.`);
  return false;
}

/* ESC ile modal kapatma */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if($('#modal-root').innerHTML) closeMatch();
  }
});

/* ------------------------------ Başlat -------------------------------- */
render();
</script>
</body>
</html>
